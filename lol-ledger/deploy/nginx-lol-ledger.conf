# /etc/nginx/conf.d/lol-ledger.conf
# 本系统独占 80 端口。原先占用 80 的官网（neizhanjizhang.conf）
# 由 deploy/install.sh 改名为 neizhanjizhang.conf.disabled-<时间>，站点文件不删。
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root  /opt/lol-ledger/frontend/dist;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/lol-ledger.access.log;
    error_log  /var/log/nginx/lol-ledger.error.log warn;

    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 注意：proxy_pass 后面不要带路径、不要带尾斜杠，
    # 否则 /api 前缀会被剥掉，后端收到 /v1/... 直接 404。
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 兜底，index.html 不缓存
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy no-referrer;
    }
}
